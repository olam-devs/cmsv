# Helion Daily Fleet Report Portal — separate from main fleet middleware (3000)
# Add DNS: report.heliontracking.com → VPS IP
# Include inside your existing http { } block (after SSL certs exist).

server {
    listen 443 ssl;
    server_name report.heliontracking.com;

    ssl_certificate     C:/nginx/nginx-1.30.0/ssl/heliontracking.com-chain.pem;
    ssl_certificate_key C:/nginx/nginx-1.30.0/ssl/heliontracking.com-key.pem;

    client_max_body_size 20m;
    proxy_read_timeout 300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name report.heliontracking.com;
    return 301 https://$host$request_uri;
}
