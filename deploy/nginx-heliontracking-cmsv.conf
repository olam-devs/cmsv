# Paste this entire http { } block content into:
# C:\nginx\nginx-1.30.0\conf\nginx.conf
# (replace the existing http { ... } section, keep worker_processes and events at top)

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name heliontracking.com www.heliontracking.com;

        client_max_body_size 50m;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;

        location /.well-known/acme-challenge/ {
            root C:/win-acme/webroot;
        }

        location = / {
            return 302 /808gps/login.html;
        }

        location = /808gps {
            return 302 /808gps/login.html;
        }

        # All CMSV web assets (HTML, CSS, JS, images, API under /808gps/)
        location /808gps/ {
            proxy_pass http://127.0.0.1:8080/808gps/;

            # Use public hostname so CMSV returns CSS/JS URLs the browser can load
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_redirect http://127.0.0.1:8080/ http://$host/;
            proxy_redirect http://176.123.10.28:8080/ http://$host/;

            # Rewrite any hard-coded :8080 URLs inside HTML/CSS/JS responses
            proxy_set_header Accept-Encoding "";
            sub_filter_types text/html text/css application/javascript text/javascript application/json;
            sub_filter "http://127.0.0.1:8080" "http://$host";
            sub_filter "http://176.123.10.28:8080" "http://$host";
            sub_filter "https://127.0.0.1:8080" "http://$host";
            sub_filter "https://176.123.10.28:8080" "http://$host";
            sub_filter_once off;

            proxy_cookie_path /808gps/ /808gps/;
        }
    }
}
